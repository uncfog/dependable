<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>You're offline | SCHOOLCORD</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
           box-sizing: border-box; font: 16px/1.5 system-ui, sans-serif; color: #0f2547; background: #f5f7fa; }
    main { max-width: 26rem; text-align: center; }
    h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
    p { margin: 0 0 1.25rem; }
    a { display: inline-block; min-height: 2.75rem; line-height: 2.75rem; padding: 0 1.25rem; border-radius: .5rem;
        background: #0f2547; color: #fff; text-decoration: none; font-weight: 600; }
    @media (prefers-color-scheme: dark) { body { color: #eef1f6; background: #0b1a33; } a { background: #eef1f6; color: #0f2547; } }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>SCHOOLCORD needs a connection, so records and payments are never kept on this device. Nothing you saved has been lost.</p>
    <a href="/dashboard/">Try again</a>
  </main>
</body>
</html>
